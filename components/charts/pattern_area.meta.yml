title: Pattern area
description: Dithered pattern fill (modules).
sizes: [full, half_horizontal, half_vertical]
usage: '{% render "homey_chart_pattern_area", data: data, trmnl: trmnl %}'
options:
  - {"key":"chart_type","type":"select","label":"Type","default":"area","choices":["line","column","bar","area","pie","scatter"]}
  - {"key":"color_scheme","type":"select","label":"Colors","default":"black","choices":["black","grey","black+grey"]}
  - {"key":"curve","type":"boolean","label":"Smooth curve","default":"no"}
  - {"key":"points","type":"boolean","label":"Point markers","default":"no"}
  - {"key":"legend","type":"select","label":"Legend","default":"none","choices":["none","bottom","right"]}
  - {"key":"stacked","type":"boolean","label":"Stacked","default":"no"}
  - {"key":"data_labels","type":"boolean","label":"Data labels","default":"no"}
  - {"key":"gridlines","type":"select","label":"Gridlines","default":"dotted","choices":["dotted","solid","none"]}
  - {"key":"modules","type":"boolean","label":"Load more+pattern modules","default":"yes"}
  - {"key":"library","type":"textarea","label":"Raw Highcharts library (JSON)","default":"{\"plotOptions\":{\"series\":{\"fillOpacity\":1,\"fillColor\":{\"pattern\":{\"path\":{\"d\":\"M 0 0 L 6 6 M -1 5 L 1 7 M 5 -1 L 7 1\",\"stroke\":\"#000000\",\"strokeWidth\":1},\"width\":6,\"height\":6,\"color\":\"#000000\"}}}}}"}
