---
title: Chart (configurable)
description: Chartkick/Highcharts chart with full e-ink tuning plus a raw library
  passthrough.
sizes:
- full
- half_horizontal
- half_vertical
usage: '{% render "trmnl_chart", data: data %}'
variants:
- name: Line
  args: {}
- name: Column, grey
  args:
    chart_type: column
    color_scheme: grey
- name: Legend + data labels
  args:
    legend: bottom
    data_labels: 'yes'
