title: Table
description: Structured rows with the framework table-overflow engine ("and N more").
sizes: [full, half_horizontal, half_vertical]
wrap: true
usage: '{% render "homey_table", columns: columns, rows: rows, align: align, trmnl: trmnl %}'
options:
